[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gffs"
version = "0.1.0"
description = "Graph-Forecast Fraud Scenarios: forecast undocumented attack-technique combinations"
requires-python = ">=3.11"
dependencies = ["networkx", "pandas", "numpy", "scikit-learn", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
